    <h2>Register for Tech Fest 2026</h2>

    <p>Fill in the form to register for our event.</p>

    <form onsubmit="register(event)">

        <label>Full Name:</label><br>
        <input type="text" id="name" required><br><br>

        <label>Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label>Department:</label><br>
        <input type="text" id="department" required><br><br>

        <button type="submit">Submit Registration</button>

    </form>
<p>Registration is free for all students!</p>
  <script>
        function register(event) {
            event.preventDefault();
            window.alert("Thank you for registering for TECH FEST 2026!");
        }
    </script>

    <footer>
        <p>TECH FEST 2026 | Innovation and Technology</p>
    </footer>
